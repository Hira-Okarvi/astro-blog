media:
  input: public
  output: /
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    view:
      fields: [ title, draft, date ]
    fields:
      - { name: author, label: Author, type: string }
      - { name: pubDatetime, label: Date, type: date }
      - { name: modDatetime, label: Date, type: date }
      - { name: title, label: Title, type: string, required: true }
      - { name: ogImage, label: Title, type: string }
      - { name: slug, label: Slug, type: string }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: description, label: Description, type: string }
      - { name: body, label: Body, type: rich-text }
  - name: home
    label: Home page
    type: file
    path: src/content/home/index.md
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Role / Tagline, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: profileImage, label: Profile Image, type: image }
      - { name: email, label: Email, type: string }
      - { name: location, label: Location, type: string }
      - { name: stats, label: Hero Stats, type: object, list: true, fields: [ { name: value, label: Value, type: string }, { name: label, label: Label, type: string } ] }
      - { name: aboutTitle, label: About Title, type: string }
      - { name: aboutText, label: About Text, type: text }
      - { name: highlights, label: Experience Highlights, type: object, list: true, fields: [ { name: value, label: Value, type: string }, { name: label, label: Label, type: string } ] }
      - { name: services, label: Services, type: object, list: true, fields: [ { name: icon, label: Icon, type: string }, { name: title, label: Title, type: string }, { name: description, label: Description, type: text } ] }
      - { name: projects, label: Projects, type: object, list: true, fields: [ { name: title, label: Title, type: string }, { name: stack, label: Tech Stack, type: string }, { name: category, label: Category, type: string } ] }
      - { name: experience, label: Experience Timeline, type: object, list: true, fields: [ { name: time, label: Period, type: string }, { name: title, label: Title, type: string }, { name: description, label: Description, type: text } ] }
      - { name: skills, label: Skills, type: string, list: true }
      - { name: ctaText, label: CTA Heading, type: string }
      - { name: ctaSub, label: CTA Sub-text, type: text }
      - { name: ctaLink, label: CTA Button Link, type: string }
      - { name: body, label: Body, type: rich-text, options: { input: public/assets, output: /assets } }
  - name: about
    label: About page
    type: file
    path: src/pages/about.md
    fields:
      - { name: layout, type: string, hidden: true, default: "../layouts/AboutLayout.astro" }
      - { name: title, label: Title, type: string }
      - { name: body, label: Body, type: rich-text, options: { input: public/assets, output: /assets } }
